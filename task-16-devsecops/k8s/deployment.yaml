# Deployment for the scanned image.
#
# The security posture here mirrors what the pipeline enforces on the image:
# non-root, no privilege escalation, read-only root filesystem, dropped
# capabilities. A scanner that gates the image is worth little if the runtime
# then hands the container root.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-api
  labels:
    app: devsecops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-api
  template:
    metadata:
      labels:
        app: devsecops-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          # The pipeline replaces this tag with the commit SHA. Never :latest -
          # a deployed image must be traceable to the commit that built it.
          image: ghcr.io/OWNER/REPO:sha-REPLACED_BY_PIPELINE
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # Secrets come from a Secret, configuration from a ConfigMap. Neither
          # is ever written into the image or the manifest.
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: devsecops-api-config
                  key: ENVIRONMENT
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: devsecops-api-secret
                  key: API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devsecops-api-secret
                  key: DATABASE_URL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi

          # The three probes, as established in session 13.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          # readOnlyRootFilesystem means anything that writes needs a volume.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
