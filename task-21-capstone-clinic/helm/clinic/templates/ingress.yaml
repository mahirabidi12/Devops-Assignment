{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clinic.fullname" . }}
  labels:
    {{- include "clinic.labels" . | nindent 4 }}
  annotations:
    {{- if not .Values.ingress.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Order matters: the more specific /api prefix must come first, or
          # the catch-all / would swallow it.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "clinic.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "clinic.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
