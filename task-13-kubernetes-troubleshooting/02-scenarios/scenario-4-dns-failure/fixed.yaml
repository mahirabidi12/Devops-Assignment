# FIX: the original resolved postgres-db-wrong-name.production.svc.cluster.local,
# a Service that does not exist in a namespace that does not exist.
# This version creates the Service it talks to and uses the correct FQDN.
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  labels:
    scenario: dns-failure
spec:
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres-db-stub
  labels:
    app: postgres-db
    tier: triage-gauntlet
    scenario: dns-failure
spec:
  containers:
    - name: stub
      image: nginx:1.27-alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: fix-4-dns-failure-pod
  labels:
    tier: triage-gauntlet
    scenario: dns-failure
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sh", "-c"]
      args:
        - |
          echo "Resolving postgres-db.default.svc.cluster.local ...";
          nslookup postgres-db.default.svc.cluster.local;
          echo "Connecting ...";
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --connect-timeout 3 http://postgres-db.default.svc.cluster.local:5432
