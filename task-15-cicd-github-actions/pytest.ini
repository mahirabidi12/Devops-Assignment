[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --cov=app --cov-report=term-missing

# Puts the project root on sys.path so `from app.calculator import ...` resolves.
# Without it a bare `pytest` fails to collect, while `python -m pytest` works,
# because the latter adds the working directory to sys.path and the former does
# not. CI runs the bare form.
pythonpath = .
