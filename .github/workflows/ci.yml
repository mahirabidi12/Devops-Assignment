# Continuous Integration: lint, test, build.
#
# Lives at the repository root because GitHub only runs workflows from
# `.github/workflows/` there. The `paths:` filters below scope it to the
# session 16 project, so editing any other task does not trigger it.

name: CI

# Triggers: what causes this workflow to run.
on:
  push:
    branches: [main]
    paths:
      - 'task-15-cicd-github-actions/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'task-15-cicd-github-actions/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:        # a manual "Run workflow" button
  schedule:
    - cron: '0 3 * * 1'     # Mondays at 03:00 UTC, to catch dependency rot

env:
  PYTHON_VERSION: '3.12'
  IMAGE_NAME: calculator

# The project is a subdirectory of this repository, so every `run` step starts
# there. `uses:` steps that take a path need it spelled out separately.
defaults:
  run:
    working-directory: task-15-cicd-github-actions

jobs:
  # ---------------------------------------------------------------- lint ----
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8
        run: flake8 app/ tests/ --max-line-length=100

  # ---------------------------------------------------------------- test ----
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint                      # does not start until lint passes

    strategy:
      fail-fast: false               # one version failing does not cancel the rest
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      # Artifacts outlive the job, so a failed run can be inspected afterwards.
      - name: Upload coverage report
        if: always()                 # upload even when the tests failed
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: task-15-cicd-github-actions/coverage.xml
          retention-days: 7

  # --------------------------------------------------------------- build ----
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: task-15-cicd-github-actions
          push: false                # CI builds, CD pushes
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Save the image as an artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: task-15-cicd-github-actions/image.tar.gz
          retention-days: 3
