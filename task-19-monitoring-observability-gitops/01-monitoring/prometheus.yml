global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules are loaded from here. Prometheus evaluates them on every
# evaluation_interval and marks a series firing when the expression holds for
# longer than its `for` duration.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus scrapes itself. Useful as a liveness signal for the scraper.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host CPU, memory, disk and network.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
