{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.fullname" . }}-secret
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  # stringData takes plaintext and encodes it, avoiding the trailing-newline
  # bug that `echo "value" | base64` causes.
  #
  # A Kubernetes Secret is base64, not encryption. For production this chart
  # would take an existing secret name instead, populated by an external
  # secrets operator from Vault or AWS Secrets Manager.
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ include "taskboard.databaseUrl" . | quote }}
{{- end }}
