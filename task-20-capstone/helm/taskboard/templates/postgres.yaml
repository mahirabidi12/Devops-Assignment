{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.fullname" . }}-postgres
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  # Headless, so the StatefulSet pod gets a stable DNS name of its own.
  clusterIP: None
  selector:
    {{- include "taskboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "taskboard.fullname" . }}-postgres
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "taskboard.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "taskboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "taskboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskboard.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            # The default data directory is the volume mount root, which
            # postgres refuses to initialise if lost+found exists. A subdirectory
            # avoids that on any storage class that creates one.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  # One PVC per pod, created automatically and reattached on restart.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
