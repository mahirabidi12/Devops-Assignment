# Continuous Deployment: publish the image, then deploy it.
#
# Scoped with `paths:` to the session 16 project.

name: CD

on:
  # Runs only after CI succeeded on main. Chaining workflows this way keeps the
  # deploy from ever running against code that failed its tests.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Manual deploy, with the environment chosen at run time.
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy to
        required: true
        default: staging
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------- publish ----
  publish:
    name: Publish image
    runs-on: ubuntu-latest

    # Do not publish if CI failed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write              # needed to push to GHCR
      id-token: write              # for OIDC, if deploying to a cloud

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is provided automatically and scoped to this repository.
      # No secret has to be created for GHCR.
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: task-15-cicd-github-actions
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------- deploy ----
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: publish

    # Skipped unless a cluster has been wired up. Without this guard the job
    # fails on every run and turns the whole pipeline red.
    if: vars.DEPLOY_ENABLED == 'true'

    # An environment can require manual approval before the job runs, which is
    # how a production gate is implemented.
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Secrets are masked in logs. Anything echoed here appears as ***.
      - name: Configure cluster access
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy with Helm
        run: |
          helm upgrade --install calculator ./chart \
            --namespace "${{ github.event.inputs.environment || 'staging' }}" \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=sha-${{ github.sha }} \
            --wait --timeout 5m \
            --atomic

      # --wait makes the step fail if the pods never become ready, and --atomic
      # rolls back automatically. Without them Helm reports success for a deploy
      # whose pods are in ImagePullBackOff - demonstrated for real in task 14.
      - name: Verify the rollout
        run: |
          kubectl rollout status deployment/calculator \
            -n "${{ github.event.inputs.environment || 'staging' }}" --timeout=2m
