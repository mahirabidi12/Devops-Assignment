# A second Application pointing at ArgoCD's own public example repository.
#
# This one exists so the sync can be demonstrated for real right now. The
# Application in argocd-application.yaml points at this homework repository,
# and can only sync once the manifests have been pushed to GitHub.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
